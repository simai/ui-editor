<!-- sf-editor, light: one short page in an example frame of the documentation.
     The frame gives the Framework (core.css, the Loader) and the set editor
     (data-sf-sets="editor@<version>" on core.min.js); this fragment gives
     the editor its height, nine steps of --sf-space-7 (the editor's own
     minimum is eight), and index.js gives it the page. -->
<div class="flex flex-col gap-1" style="block-size: calc(var(--sf-space-7) * 9)">
  <sf-editor id="light-editor" class="grow min-h-0" heading="Новая страница" caption="Пример · изменения не сохраняются"></sf-editor>
  <p class="m-0 text-1/3 color-on-surface-variant" id="light-editor-log" role="status"></p>
</div>
