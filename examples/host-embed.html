<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host demo: the editor on one page</title>
  <link rel="icon" href="data:,">
  <!-- A host of the single-page mode (docs/HOST-EMBED.md), as small as it can
       be: it embeds the editor in an iframe, loads one page into it and keeps
       what the editor hands back on save. A real host (Bitrix, Larena, mail)
       loads the page from its own storage and writes it back there. -->
  <!-- The page is the SIMAI Framework's like the editor inside it: core.css,
       the Loader (utilities and Smart elements on demand) and no sheet of
       its own. -->
  <link rel="stylesheet" href="../fw/core/css/core.css">
  <script>
    window.sfPath = new URL('../fw/', document.baseURI).href;
    window.SF_BOOT_CONFIG = {icons: {enabled: false}};
  </script>
  <script src="../fw/core/js/core.js"></script>
</head>
<body class="h-screen m-0 flex flex-col bg-surface-0 color-on-surface">
  <header class="flex items-cross-center gap-2 p-x-2 p-y-1 border-bottom-1 border-outline-variant text-1">
    <strong class="weight-6">Host demo</strong>
    <!-- The state in words for the run and a screen reader, and as a badge to the eye. -->
    <span id="state" role="status" class="sr-only">waiting for the editor</span>
    <sf-badge id="state-badge" appearance="tonal" activity="waiting" text="waiting for the editor" aria-hidden="true"></sf-badge>
  </header>
  <iframe id="editor" class="grow min-h-0 w-full border-0" title="Page editor"></iframe>
  <script type="module">
    const frame = document.getElementById('editor');
    const status = document.getElementById('state');
    const badge = document.getElementById('state-badge');
    /** The state in words, and the badge's colour by it: done, unsaved, failed. */
    const state = {
      set textContent(text) {
        status.textContent = text;
        badge.setAttribute('text', text);
        badge.removeAttribute('activity');
        const tone = /refused|failed/u.test(text) ? 'error' : text.startsWith('unsaved') ? 'warning' : 'success';
        badge.setAttribute('status', tone);
      },
      get textContent() {
        return status.textContent;
      },
    };
    const language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru';
    // The editor answers only this page's origin.
    frame.src = `../index.html?mode=page&host=${encodeURIComponent(location.origin)}`;
    let revision = 0;
    let published = 1;
    /** What the host received: the end-to-end run reads it. */
    window.hostDemo = {saves: [], dirty: false, errors: [], actions: []};

    addEventListener('message', async (event) => {
      if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
      const message = event.data;
      if (message.type === 'sf-editor:ready') {
        const page = await (await fetch(`page.${language}.json`)).json();
        revision = page.revision;
        published = page.settings?.history ?? published;
        frame.contentWindow.postMessage({type: 'sf-editor:load', ...page, language}, location.origin);
      } else if (message.type === 'sf-editor:loaded') {
        state.textContent = `page loaded, revision ${message.revision}`;
      } else if (message.type === 'sf-editor:dirty') {
        window.hostDemo.dirty = message.dirty;
        state.textContent = message.dirty ? 'unsaved changes' : `saved, revision ${revision}`;
      } else if (message.type === 'sf-editor:save') {
        // A real host writes the page to its storage here and gets a new revision.
        window.hostDemo.saves.push(message);
        revision += 1;
        frame.contentWindow.postMessage({type: 'sf-editor:saved', revision}, location.origin);
      } else if (message.type === 'sf-editor:page-action') {
        // Publishing and history are the host's. This demo publishes at once
        // and keeps a count of versions; a real host publishes the saved
        // revision and opens its own history.
        window.hostDemo.actions.push(message);
        if (message.action === 'publish') {
          published += 1;
          frame.contentWindow.postMessage({type: 'sf-editor:settings', settings: {published: true, changes: false, history: published}}, location.origin);
          state.textContent = `published, revision ${revision}`;
        }
      } else if (message.type === 'sf-editor:error') {
        window.hostDemo.errors.push(message);
        state.textContent = `the editor refused the page: ${message.code}`;
      }
    });
  </script>
</body>
</html>
