<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="sf-release" content="ui-b8e23367889f">
  <title>SIMAI — редактор страниц</title>
  <link rel="stylesheet" href="fw/core/css/core.css">
  <link rel="stylesheet" href="app.css">
  <script>
    window.sfPath = new URL('fw/', document.baseURI).href;
    // Icons come from the font in the Framework package, not from a subset
    // service, so the editor works offline once loaded.
    window.SF_BOOT_CONFIG = {icons: {enabled: false}, packages: {pro: {base: 'pkg/pro/smart'}}};
  </script>
  <script src="fw/core/js/core.js"></script>
</head>
<body>
  <!-- Not a banner: the page on the canvas has its own header region. -->
  <div id="top-bar" class="top-bar flex items-cross-center gap-1/2 p-x-1" role="region" data-t-attr="aria-label:app.bar" aria-label="Редактор страниц">
    <sf-button-icon id="toggle-left" icon="left_panel_close" appearance="ghost" scheme="on-surface" size="1/2" aria-controls="left-panel" data-t-attr="aria-label:panel.toggleLeft;title:panel.toggleLeftKey" aria-label="Панель страниц"></sf-button-icon>
    <h1 class="top-title text-1/2 truncate m-0" data-t="app.title">SIMAI — редактор страниц</h1>
    <span class="grow"></span>
    <sf-button-group id="language" appearance="segmented" plate="raised" size="1/2" data-t-attr="aria-label:language.label" aria-label="Язык интерфейса" items='[{"value":"ru","label":"RU"},{"value":"en","label":"EN"}]'></sf-button-group>
  </div>

  <div id="storage-state" class="storage-state p-x-1 p-y-1/2 text-1/2" role="status" data-t="storage.unavailable" hidden></div>

  <!-- No main landmark here: the page on the canvas has its own main region. -->
  <div id="editor" class="editor" data-sf-drawer-dock-host>
    <sf-drawer id="left-panel" docked open show-close="false" gutter="var(--sf-space-1)" placement="inline-start" width="var(--pages-width, var(--sf-f8))" data-t-attr="label:panel.pages" label="Страницы">
      <div id="pages-pane" class="flex flex-col gap-1/2">
        <h2 class="pane-title m-0" data-t="panel.pages">Страницы</h2>
        <sf-menu id="pages" orientation="vertical" data-t-attr="label:pages.list" label="Список страниц"></sf-menu>
        <sf-button id="new-page" appearance="outline" size="1/2" icon-start="add" text="Новая страница" data-t-attr="text:pages.new"></sf-button>
        <p class="muted text-1/2 m-0" data-t="pages.local">Страницы хранятся только в этом браузере.</p>
      </div>
      <!-- Named by its own `label`, rewritten on every language switch. -->
      <sf-resizer id="resizer-left" data-t-attr="label:panel.resizePages" label="Ширина панели страниц" target=".sf-drawer-panel" min="var(--sf-f6)" max="var(--sf-g5)" property="--pages-width" storage-key="ui-editor.pages"></sf-resizer>
    </sf-drawer>

    <div class="canvas-area">
      <sf-editor id="page-editor" preferences-key="ui-editor" data-t-attr="label:canvas.label" label="Страница"></sf-editor>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
