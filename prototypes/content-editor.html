<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор контента: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>
/* Prototype for approval (2026-10-31): the content mode of the editor, a flow
   of typing in the manner of Editor.js. It tests behaviour; the port goes to a
   Smart component. Sizes follow the Framework's ladder, colours its role names. */
:root {
  color-scheme: light;
  --surface-0: #ffffff; --surface-1: #f7f6fa; --surface-3: #ffffff;
  --on-surface: #1b1b21; --on-variant: #66666f; --faint: #9c9ca6; --outline-variant: #e6e4ec;
  --primary: #2156c1; --on-primary: #fff; --primary-soft: rgba(33,86,193,.14);
  --state-hover: rgba(27,27,33,.05); --state-press: rgba(27,27,33,.1);
  --error: #ba1a1a; --code: #f4f3f8; --callout: #f1f4fd;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 24px rgba(0,0,0,.12);
  --ease: cubic-bezier(.2,0,0,1); --dur: 160ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #141519; --surface-1: #1a1b21; --surface-3: #2a2a31;
  --on-surface: #e6e4ec; --on-variant: #a6a5b0; --faint: #6f6f7a; --outline-variant: #30303a;
  --primary: #b3c5ff; --on-primary: #002b75; --primary-soft: rgba(179,197,255,.18);
  --state-hover: rgba(227,225,233,.06); --state-press: rgba(227,225,233,.12);
  --error: #ffb4ab; --code: #1f2027; --callout: #1e2230;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface-0); color: var(--on-surface); font: 16px/26px Inter, -apple-system, system-ui, sans-serif; display: grid; grid-template-rows: 48px minmax(0, 1fr); overflow: hidden; -webkit-font-smoothing: antialiased; }
.ic { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; font-variation-settings: 'opsz' 20; user-select: none; display: block; font-weight: 400; font-style: normal; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--on-variant); flex: none; }
.ib:hover { background: var(--state-hover); color: var(--on-surface); }
.ib[disabled] { opacity: .32; pointer-events: none; }
.bar { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--outline-variant); font-size: 14px; line-height: 20px; }
.bar .doc { margin-inline: 8px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; min-width: 0; }
.bar .doc span { color: var(--on-variant); font-size: 12px; }
.grow { flex: 1; }
.work { display: grid; grid-template-columns: var(--left, 240px) minmax(0, 1fr) var(--right, 340px); grid-template-rows: minmax(0, 1fr); transition: grid-template-columns var(--dur) var(--ease); min-height: 0; }
.panel { overflow: hidden; min-width: 0; font-size: 14px; line-height: 20px; }
.panel.l { border-right: 1px solid var(--outline-variant); }
.panel.r { border-left: 1px solid var(--outline-variant); }
.panel > .in { height: 100%; overflow: auto; }
.panel.l > .in { width: 240px; padding: 12px 8px; }
.panel.r > .in { width: 340px; float: right; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.panel h3 { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--on-variant); margin: 4px 8px 8px; }
.toc a { display: block; padding: 5px 8px; border-radius: 8px; color: var(--on-surface); text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.toc a:hover { background: var(--state-hover); }
.toc a.h3 { padding-left: 22px; color: var(--on-variant); }
.toc .none { padding: 5px 8px; color: var(--faint); }
.seg { display: flex; height: 32px; padding: 2px; border-radius: 8px; background: var(--state-hover); margin: 8px; }
.seg button { min-width: 0; }
.seg button { flex: 1; border-radius: 6px; color: var(--on-variant); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--on-surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
#trip { padding: 8px 16px; font-size: 12px; line-height: 16px; color: var(--on-variant); border-top: 1px solid var(--outline-variant); }
#trip b { font-weight: 600; } #trip .ok { color: #1a7f4b; } #trip .no { color: #a86500; }
#out { margin: 0; padding: 4px 16px 24px; font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: var(--on-variant); overflow: auto; }

/* The sheet: no frames, no boxes. Text is the interface. */
.scroll { overflow: auto; position: relative; }
.sheet { position: relative; max-width: 720px; margin: 0 auto; padding: 56px 64px 40vh; }
.title { font-size: 34px; line-height: 42px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 16px; outline: 0; }
.e { outline: 0; min-height: 1em; }
[data-ph]:empty::before, [data-ph].blank::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }
.b { position: relative; border-radius: 6px; margin: 2px -8px; padding: 2px 8px; transition: background 80ms; }
.b.on { background: var(--primary-soft); }
.b.dragging { opacity: .35; }
.b p, .b h2, .b h3, .b blockquote, .b ul, .b ol, .b pre, .b figure, .b table { margin: 0; }
.b h2 { font-size: 24px; line-height: 32px; font-weight: 600; margin-top: 18px; }
.b h3 { font-size: 19px; line-height: 28px; font-weight: 600; margin-top: 12px; }
.b blockquote { border-left: 3px solid var(--outline-variant); padding-left: 16px; color: var(--on-variant); }
.b .callout { --tone: var(--primary); background: var(--callout); border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; }
.b .callout .ic { color: var(--tone); margin-top: 3px; }
.b .callout .e { flex: 1; }
.b .callout[data-type="success"] { --tone: #1a7f4b; } .b .callout[data-type="warning"] { --tone: #a86500; } .b .callout[data-type="danger"] { --tone: var(--error); } .b .callout[data-type="clear"] { --tone: var(--on-variant); }
.b .callout:not([data-type="info"]) { background: color-mix(in srgb, var(--tone) 9%, transparent); }
.b .callout[data-variant="flat"] { background: none; padding-inline: 0; }
.b .callout[data-variant="outlined"] { background: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 45%, transparent); }
.b .det { border-radius: 10px; background: var(--surface-1); padding: 10px 14px; }
.b .det[data-layout="lines"] { background: none; border-radius: 0; padding: 8px 0; border-block: 1px solid var(--outline-variant); }
.b .det > header { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.b .det > header button { color: var(--on-variant); margin-top: 3px; transition: transform var(--dur) var(--ease); }
.b .det:not(.show) > header button { transform: rotate(-90deg); }
.b .det > header .e { flex: 1; }
.b .det .body { margin: 6px 0 0 28px; }
.b .det:not(.show) .body { display: none; }
.b ol.steps { list-style: none; padding: 0; counter-reset: st; }
.b ol.steps li { counter-increment: st; position: relative; padding: 2px 0 12px 40px; }
.b ol.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--state-hover); color: var(--on-variant); }
.b ol.steps li.now::before { background: var(--primary); color: var(--on-primary); }
.b ol.steps[data-layout="timeline"] li:not(:last-child)::after { content: ''; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--outline-variant); }
.b .cw { background: var(--code); border-radius: 10px; overflow: hidden; }
.b .cw > header { display: flex; justify-content: space-between; gap: 12px; padding: 7px 16px; font-size: 12px; line-height: 16px; color: var(--on-variant); border-bottom: 1px solid var(--outline-variant); }
.b .cw[data-layout="terminal"] { background: #16171c; color: #e6e4ec; }
.b .cw[data-layout="terminal"] pre { color: #e6e4ec; }
.b .cw .rows { display: flex; }
.b .cw .nums { padding: 12px 0 12px 14px; font: 14px/22px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); text-align: right; user-select: none; white-space: pre; }
.b .cw pre { flex: 1; background: none; min-width: 0; }
.b figure .frame { overflow: hidden; border-radius: 10px; }
.b figure .frame img { width: 100%; height: 100%; border-radius: 0; }
.b .rawb { background: var(--surface-1); border-radius: 10px; overflow: hidden; }
.b .rawb > header { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; line-height: 16px; color: var(--on-variant); }
.b .rawb > header .ic { font-size: 16px; }
.b .rawb pre { background: none; padding-top: 0; font-size: 13px; line-height: 20px; }
.ptag { position: absolute; top: 4px; right: 8px; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface-3); box-shadow: 0 1px 3px rgba(0,0,0,.14); font-size: 12px; line-height: 16px; color: var(--on-variant); opacity: 0; pointer-events: none; transition: opacity 80ms; z-index: 2; white-space: nowrap; }
.ptag .ic { font-size: 14px; }
.b:hover > .ptag, .b:focus-within > .ptag, .ptag:focus-visible { opacity: 1; pointer-events: auto; }
.ptag:hover { color: var(--on-surface); }
.b ul, .b ol { padding-left: 24px; }
.b li { padding: 1px 0; }
.b pre { background: var(--code); border-radius: 10px; padding: 12px 16px; font: 14px/22px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; tab-size: 2; }
.b hr { border: 0; height: 1px; background: var(--outline-variant); margin: 14px 0; }
.b a { color: var(--primary); }
.b code { background: var(--code); border-radius: 4px; padding: 1px 5px; font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; }
.b figure img { display: block; max-width: 100%; border-radius: 10px; }
.b figure .pick { display: flex; align-items: center; justify-content: center; gap: 8px; height: 120px; width: 100%; background: var(--surface-1); border-radius: 10px; color: var(--on-variant); font-size: 14px; }
.b figure .pick:hover { background: var(--state-hover); }
.b figcaption { font-size: 14px; line-height: 20px; color: var(--on-variant); margin-top: 6px; }
.b table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 22px; }
.b td { border: 1px solid var(--outline-variant); padding: 6px 10px; vertical-align: top; min-width: 60px; }
.b table:not(.nohead) tr:first-child td { font-weight: 600; background: var(--surface-1); }
.b td:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }

/* The gutter: two quiet buttons beside the line under the pointer; gone while you type. */
.gut { position: absolute; left: 16px; display: flex; gap: 0; opacity: 0; pointer-events: none; transition: opacity 80ms; z-index: 5; }
.gut.on { opacity: 1; pointer-events: auto; }
.gut button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.gut button:hover { background: var(--state-hover); color: var(--on-surface); }
.gut .ic { font-size: 18px; }
#grip { cursor: grab; touch-action: none; }
.dropline { position: absolute; height: 2px; background: var(--primary); left: 56px; right: 56px; border-radius: 1px; display: none; z-index: 5; }

/* Menus */
.menu { position: fixed; z-index: 30; width: 264px; max-height: 460px; overflow: auto; background: var(--surface-3); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; font-size: 14px; line-height: 20px; }
.menu[hidden] { display: none; }
.menu h4 { margin: 6px 8px 4px; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--on-variant); }
.menu .row { display: flex; width: 100%; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 8px; text-align: left; }
.menu .row .ic { font-size: 18px; color: var(--on-variant); }
.menu .row small { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu .row:hover, .menu .row.active { background: var(--state-hover); }
.menu .row.danger:hover { color: var(--error); }
.menu .row.danger:hover .ic { color: var(--error); }
.menu .row[aria-current="true"] .ic { color: var(--primary); }
.menu .par { display: grid; gap: 4px; padding: 4px 8px 8px; font-size: 12px; line-height: 16px; color: var(--on-variant); }
.menu .par.line { grid-template-columns: 1fr auto; align-items: center; }
.menu .par input[type=text], .menu .par input[type=number], .menu .par select { height: 32px; width: 100%; border: 1px solid var(--outline-variant); border-radius: 8px; padding: 0 8px; background: var(--surface-0); color: var(--on-surface); font: 14px/20px Inter, -apple-system, system-ui, sans-serif; }
.menu .par .seg { margin: 0; }
.menu .par .seg button { font-size: 12px; padding: 0 6px; white-space: nowrap; }
.sw { appearance: none; width: 32px; height: 20px; border-radius: 10px; background: var(--state-press); position: relative; margin: 0; cursor: pointer; transition: background var(--dur); }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform var(--dur) var(--ease); }
.sw:checked { background: var(--primary); }
.sw:checked::after { transform: translateX(12px); }
.menu hr { border: 0; height: 1px; background: var(--outline-variant); margin: 4px 8px; }
.menu .none { padding: 6px 8px; color: var(--on-variant); }

/* The bar over a text selection */
.inl { position: fixed; z-index: 30; display: flex; align-items: center; padding: 4px; gap: 0; background: var(--surface-3); border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; line-height: 20px; }
.inl[hidden] { display: none; }
.inl .ib[aria-pressed="true"] { color: var(--primary); background: var(--primary-soft); }
.inl input { height: 32px; width: 220px; border: 0; background: transparent; color: inherit; font: inherit; padding: 0 8px; outline: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); background: var(--on-surface); color: var(--surface-0); border-radius: 10px; padding: 8px 14px; font-size: 14px; line-height: 20px; opacity: 0; pointer-events: none; transition: opacity var(--dur), transform var(--dur) var(--ease); z-index: 40; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 720px) { .sheet { padding: 32px 40px 40vh; } .gut { left: 0; } }
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="t-left" aria-label="Оглавление" title="Оглавление"><span class="ic">left_panel_close</span></button>
  <div class="doc"><b style="font-weight:500">Страница</b><span id="saved">Сохранено</span></div>
  <button class="ib" id="undo" aria-label="Отменить" title="Отменить  ⌘Z" disabled><span class="ic">undo</span></button>
  <button class="ib" id="redo" aria-label="Повторить" title="Повторить  ⇧⌘Z" disabled><span class="ic">redo</span></button>
  <div class="grow"></div>
   <button class="ib" id="file-btn" aria-label="Сохранить или открыть" title="Сохранить или открыть"><span class="ic">save</span></button>
  <button class="ib" id="reset" aria-label="Вернуть образец" title="Вернуть образец"><span class="ic">restart_alt</span></button>
  <button class="ib" id="theme" aria-label="Тема" title="Светлая или тёмная"><span class="ic">dark_mode</span></button>
  <button class="ib" id="t-right" aria-label="Что сохраняется" title="Что сохраняется"><span class="ic">right_panel_close</span></button>
</header>
<div class="work" id="work">
  <aside class="panel l" id="left"><div class="in"><h3>Оглавление</h3><nav class="toc" id="toc"></nav></div></aside>
  <main class="scroll" id="scroll">
    <div class="sheet" id="sheet">
      <h1 class="title" id="title" contenteditable="plaintext-only" data-ph="Без названия" role="textbox" aria-label="Заголовок страницы"></h1>
      <div id="doc"></div>
      <div class="gut" id="gut"><button id="plus" aria-label="Добавить блок" title="Добавить блок"><span class="ic">add</span></button><button id="grip" aria-label="Действия с блоком" title="Щелчок: меню. Потянуть: перенести"><span class="ic">drag_indicator</span></button></div>
      <div class="dropline" id="drop"></div>
    </div>
  </main>
  <aside class="panel r" id="right"><div class="in">
    <div class="seg" id="tabs"><button data-t="json" aria-pressed="true">JSON</button><button data-t="md" aria-pressed="false">Markdown</button><button data-t="html" aria-pressed="false">HTML</button></div>
    <pre id="out"></pre>
    <div id="trip"></div>
  </div></aside>
</div>
<div class="menu" id="menu" hidden></div>
<div class="inl" id="inl" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="open-file" accept=".md,.markdown,.json,text/markdown,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {get(k) { try { return localStorage.getItem('content-editor.' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('content-editor.' + k, v); } catch {} }};
let uid = 100; const nid = () => 'c' + ++uid;

const TYPES = [
  {t: 'p', label: 'Текст', icon: 'notes', find: 'абзац текст'},
  {t: 'h2', label: 'Заголовок', icon: 'title', hint: '##', find: 'заголовок h2'},
  {t: 'h3', label: 'Подзаголовок', icon: 'text_fields', hint: '###', find: 'подзаголовок h3'},
  {t: 'ul', label: 'Список', icon: 'format_list_bulleted', hint: '-', find: 'список маркированный'},
  {t: 'ol', label: 'Нумерованный список', icon: 'format_list_numbered', hint: '1.', find: 'список нумерованный'},
  {t: 'quote', label: 'Цитата', icon: 'format_quote', hint: '>', find: 'цитата'},
  {t: 'alert', label: 'Заметка', icon: 'info', find: 'заметка важно предупреждение alert'},
  {t: 'details', label: 'Раскрывающийся блок', icon: 'expand_circle_down', find: 'раскрывающийся details спойлер вопрос'},
  {t: 'steps', label: 'Шаги', icon: 'format_list_numbered_rtl', find: 'шаги инструкция steps'},
  {t: 'table', label: 'Таблица', icon: 'table', find: 'таблица'},
  {t: 'image', label: 'Картинка', icon: 'image', find: 'картинка изображение фото'},
  {t: 'code', label: 'Код', icon: 'code', hint: '```', find: 'код'},
  {t: 'hr', label: 'Разделитель', icon: 'horizontal_rule', hint: '---', find: 'разделитель линия'},
];
const TEXTY = new Set(['p', 'h2', 'h3', 'quote', 'alert']);
const LISTY = new Set(['ul', 'ol', 'steps']);
/* A block's parameters are data, in the shape of the Composition editor manifest:
   the form is built from this, nothing is drawn by hand per block. Names and values
   are Docara's catalog where it has the block. */
const PARAMS = {
  alert: [{k: 'type', label: 'Вид', values: [['info', 'Сведения'], ['success', 'Успех'], ['warning', 'Внимание'], ['danger', 'Опасность'], ['clear', 'Обычная']], def: 'info'}, {k: 'variant', label: 'Оформление', values: [['default', 'Заливка'], ['flat', 'Плоско'], ['outlined', 'Рамка']], def: 'default'}],
  details: [{k: 'open', label: 'Открыт сразу', bool: true, def: false}, {k: 'layout', label: 'Оформление', values: [['surface', 'Заливка'], ['lines', 'Линии']], def: 'surface'}],
  image: [{k: 'ratio', label: 'Пропорции', values: [['auto', 'Как есть'], ['1/1', '1:1'], ['4/3', '4:3'], ['3/2', '3:2'], ['16/9', '16:9'], ['21/9', '21:9']], def: 'auto'}, {k: 'fit', label: 'Вписать', values: [['cover', 'Заполнить'], ['contain', 'Целиком']], def: 'cover'}],
  code: [{k: 'lang', label: 'Язык', text: true, def: 'text'}, {k: 'title', label: 'Подпись', text: true, def: ''}, {k: 'numbers', label: 'Номера строк', bool: true, def: false}, {k: 'layout', label: 'Оформление', values: [['default', 'Обычный'], ['terminal', 'Терминал']], def: 'default'}],
  steps: [{k: 'layout', label: 'Оформление', values: [['timeline', 'Линия'], ['list', 'Список']], def: 'timeline'}, {k: 'current', label: 'Текущий шаг', int: true, def: 1}],
  table: [{k: 'header', label: 'Строка заголовка', bool: true, def: true}],
};
const propsFor = (type) => Object.fromEntries((PARAMS[type] || []).map((p) => [p.k, p.def]));

  const parts = t.replace(/\r/g, '').split(/\n{2,}/).map((x) => x.trim()).filter(Boolean), out = [];

    const lines = part.split('\n');
    if (lines.every((l) => /^\s*[-*•]\s+/.test(l))) out.push({id: nid(), type: 'ul', items: lines.map((l) => esc(l.replace(/^\s*[-*•]\s+/, '')))});
    else if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) out.push({id: nid(), type: 'ol', items: lines.map((l) => esc(l.replace(/^\s*\d+[.)]\s+/, '')))});
    else if (/^#{1,2} /.test(part)) out.push({id: nid(), type: 'h2', html: esc(part.replace(/^#+ /, ''))});
    else if (/^#{3,} /.test(part)) out.push({id: nid(), type: 'h3', html: esc(part.replace(/^#+ /, ''))});
    else out.push({id: nid(), type: 'p', html: lines.map(esc).join('<br>')});
  }
  return out;
}
root.addEventListener('paste', (e) => {
  const el = e.target.closest('.e'); if (!el) return;
  const b = blockFromNode(el), cd = e.clipboardData;
  e.preventDefault();
  if (b.type === 'code') { document.execCommand('insertText', false, cd.getData('text/plain')); return; }
  const file = [...cd.files].find((f) => f.type.startsWith('image/'));
  if (file) { push(); const n = newBlock('image'); doc.blocks.splice(indexOf(b.id) + 1, 0, n); reconcile(); loadImage(n.id, file); return; }
  const html = cd.getData('text/html'), text = cd.getData('text/plain');
  const blocks = html ? blocksFromHtml(html) : blocksFromText(text);
  if (!blocks.length) return;
  /* One line goes into the caret; several become blocks. In a table cell it stays text. */
  if ((blocks.length === 1 && TEXTY.has(blocks[0].type)) || b.type === 'table' || LISTY.has(b.type) || el.dataset.cap) {
    const inlineHtml = blocks.length === 1 && TEXTY.has(blocks[0].type) ? blocks[0].html : esc(text.replace(/\s*\n\s*/g, ' '));
    pushTyping(); document.execCommand('insertHTML', false, inlineHtml); readEdit(el); changed(); return;
  }
  push(); const i = indexOf(b.id), [head, tail] = TEXTY.has(b.type) ? splitHtml(el) : [b.html, ''];
  const add = [...blocks]; if (tail) add.push({id: nid(), type: 'p', html: tail});
  if (TEXTY.has(b.type)) { b.html = head; draw(b); }
  if (TEXTY.has(b.type) && !head && b.type === 'p') doc.blocks.splice(i, 1, ...add); else doc.blocks.splice(i + 1, 0, ...add);
  reconcile(); changed();
  const lastAdded = elOf(add[add.length - 1].id); placeCaret(lastEdit(lastAdded)); say(`Вставлено блоков: ${add.length}`);
});

/* ------- Images ------- */
function loadImage(id, file) {
  if (file.size > 3 * 1024 * 1024) { toast('В прототипе картинки до 3 МБ'); return; }
  const r = new FileReader(); r.onload = () => { const b = blockAt(id); if (!b) return; b.src = r.result; draw(b); changed(); }; r.readAsDataURL(file);
}
root.addEventListener('click', (e) => { const p = e.target.closest('[data-pick]'); if (p) { const b = blockFromNode(p); $('file').dataset.for = b.id; $('file').click(); } });
$('file').addEventListener('change', () => { const f = $('file').files[0], id = $('file').dataset.for; if (f && id) { push(); loadImage(id, f); } $('file').value = ''; });
root.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
root.addEventListener('drop', (e) => { const f = [...e.dataTransfer.files].find((x) => x.type.startsWith('image/')); if (!f) return; e.preventDefault(); const b = blockFromNode(e.target) || doc.blocks[doc.blocks.length - 1]; push(); const n = newBlock('image'); doc.blocks.splice(indexOf(b.id) + 1, 0, n); reconcile(); loadImage(n.id, f); });
root.addEventListener('click', (e) => { if (e.target.closest('a') && !(e.metaKey || e.ctrlKey)) e.preventDefault(); });

/* ------- The bar ------- */
let toastTimer; function toast(t) { $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 3000); }
const say = (t) => { $('live').textContent = t; };
const open = {left: store.get('left') !== '0' && innerWidth >= 1100, right: store.get('right') !== '0' && innerWidth >= 1280};
function panels() {
  const w = $('work'); w.style.setProperty('--left', open.left ? '240px' : '0px'); w.style.setProperty('--right', open.right ? '340px' : '0px');
  $('t-left').firstElementChild.textContent = open.left ? 'left_panel_close' : 'left_panel_open';
  $('t-right').firstElementChild.textContent = open.right ? 'right_panel_close' : 'right_panel_open';
  $('left').inert = !open.left; $('right').inert = !open.right;
}
$('t-left').onclick = () => { open.left = !open.left; store.set('left', open.left ? '1' : '0'); panels(); };
$('t-right').onclick = () => { open.right = !open.right; store.set('right', open.right ? '1' : '0'); panels(); };
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.code === 'Backslash') { e.preventDefault(); (e.altKey ? $('t-right') : $('t-left')).click(); } });
panels();
const setTheme = (t) => { document.documentElement.dataset.theme = t; $('theme').firstElementChild.textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; store.set('theme', t); };
setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('reset').onclick = () => { push(); doc = structuredClone(SAMPLE); renderAll(); toast('Образец возвращён. ⌘Z вернёт ваш текст'); };

renderAll();
$('title').classList.toggle('blank', !doc.title);
</script>
