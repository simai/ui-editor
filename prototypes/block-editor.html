<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один редактор блоков: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>
/* Prototype for approval (2026-11-03): one editor for layout and text, per
   control/ui-editor/UNIFIED-BLOCK-EDITOR.md. It tests behaviour: depth
   selection, one catalogue, layered parameters, data bindings, roles, one undo.
   Sizes follow the Framework's ladder, colours its role names. No backend. */
:root {
  color-scheme: light;
  --surface-0: #ffffff; --surface-1: #f4f3f8; --surface-2: #ecebf1; --surface-3: #ffffff;
  --on-surface: #1b1b21; --on-variant: #66666f; --faint: #9c9ca6; --outline-variant: #e3e1e9;
  --primary: #2156c1; --on-primary: #fff; --primary-soft: rgba(33,86,193,.12); --primary-line: rgba(33,86,193,.45);
  --state-hover: rgba(27,27,33,.05); --state-press: rgba(27,27,33,.1);
  --error: #ba1a1a; --success: #1a7f4b; --warning: #a86500; --callout: #eef2fc;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 24px rgba(0,0,0,.12);
  --ease: cubic-bezier(.2,0,0,1); --dur: 160ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #141519; --surface-1: #1a1b21; --surface-2: #22232a; --surface-3: #2a2a31;
  --on-surface: #e6e4ec; --on-variant: #a6a5b0; --faint: #6f6f7a; --outline-variant: #30303a;
  --primary: #b3c5ff; --on-primary: #002b75; --primary-soft: rgba(179,197,255,.16); --primary-line: rgba(179,197,255,.5);
  --state-hover: rgba(227,225,233,.06); --state-press: rgba(227,225,233,.12);
  --error: #ffb4ab; --success: #7ad6a3; --warning: #f3bd6e; --callout: #1e2230;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface-0); color: var(--on-surface); font: 14px/20px Inter, -apple-system, system-ui, sans-serif; display: grid; grid-template-rows: 48px minmax(0, 1fr); overflow: hidden; -webkit-font-smoothing: antialiased; }
.ic { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; font-variation-settings: 'opsz' 20; user-select: none; display: inline-block; font-weight: 400; font-style: normal; vertical-align: middle; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--on-variant); flex: none; }
.ib:hover { background: var(--state-hover); color: var(--on-surface); }
.ib[disabled] { opacity: .32; pointer-events: none; }
.ib .ic { font-size: 20px; }
.grow { flex: 1; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--outline-variant); }
.bar .doc { margin: 0 8px; font-weight: 600; white-space: nowrap; }
.bar .doc span { font-weight: 400; color: var(--on-variant); font-size: 12px; margin-left: 6px; }
.seg { display: inline-flex; height: 32px; padding: 2px; border-radius: 8px; background: var(--state-hover); }
.seg button { padding: 0 10px; border-radius: 6px; color: var(--on-variant); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.seg button .ic { font-size: 18px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--on-surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tsel { height: 32px; border: 1px solid var(--outline-variant); border-radius: 8px; background: var(--surface-0); padding: 0 8px; font-size: 13px; }
.sep { width: 1px; height: 20px; background: var(--outline-variant); margin: 0 4px; }

/* Workspace */
.work { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; min-height: 0; }
.panel { min-width: 0; min-height: 0; overflow: auto; }
.panel.l { border-right: 1px solid var(--outline-variant); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.panel.r { border-left: 1px solid var(--outline-variant); }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--outline-variant); }
.tabs button { padding: 6px 10px 8px; color: var(--on-variant); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--on-surface); border-color: var(--primary); }
.pane { overflow: auto; padding: 8px; }
.search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 8px; background: var(--state-hover); margin-bottom: 8px; }
.search input { border: 0; background: none; outline: 0; flex: 1; min-width: 0; }
.search .ic { font-size: 18px; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.chip { height: 24px; padding: 0 8px; border-radius: 12px; font-size: 12px; color: var(--on-variant); box-shadow: inset 0 0 0 1px var(--outline-variant); }
.chip[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); box-shadow: none; }
.grp { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--on-variant); margin: 12px 8px 4px; display: flex; align-items: center; gap: 6px; }
.grp:first-child { margin-top: 4px; }
.lib-item { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 6px 4px 8px; border-radius: 8px; cursor: grab; user-select: none; }
.lib-item:hover { background: var(--state-hover); }
.lib-item .ic.t { color: var(--on-variant); }
.lib-item .nm { flex: 1; min-width: 0; }
.lib-item .nm small { display: block; color: var(--faint); font-size: 12px; line-height: 16px; }
.lib-item .star, .lib-item .more { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); opacity: 0; }
.lib-item:hover .star, .lib-item:hover .more, .lib-item .star.on, .lib-item .more.on { opacity: 1; }
.lib-item .star.on { color: #c98a00; }
.lib-item .star .ic, .lib-item .more .ic { font-size: 18px; }
.vars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 6px 8px 8px; }
.var { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--outline-variant); padding: 6px; cursor: grab; text-align: left; }
.var:hover { box-shadow: inset 0 0 0 1px var(--primary-line); background: var(--state-hover); }
.var .pv { height: 44px; border-radius: 4px; background: var(--surface-1); margin-bottom: 4px; display: grid; gap: 3px; padding: 5px; overflow: hidden; }
.var .pv i { display: block; background: var(--faint); opacity: .35; border-radius: 2px; }
.var .pv i.acc { background: var(--primary); opacity: .55; }
.var span { font-size: 12px; line-height: 16px; display: block; }
.libtabs { display: flex; width: 100%; margin-bottom: 8px; }
.libtabs button { flex: 1; justify-content: center; font-weight: 500; }
.lib-item.sub { cursor: pointer; }
.lib-item .cnt { font-size: 12px; color: var(--faint); min-width: 16px; text-align: right; }
.lib-item.back { width: 100%; text-align: left; cursor: pointer; margin-bottom: 2px; }
.lib-item.back b { font-weight: 600; }
.gut { position: absolute; z-index: 21; display: none; align-items: center; }
.gut.on { display: flex; }
.gut button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.gut button:hover { background: var(--state-hover); color: var(--on-surface); }
.gut button .ic { font-size: 18px; }
.gut [data-g="grip"] { cursor: grab; }
.n.tpl.hover::after { content: 'Шаблон сайта · общий для всех страниц'; position: absolute; right: 8px; top: 4px; font-size: 11px; line-height: 16px; padding: 1px 6px; border-radius: 4px; background: #fff4dc; color: #5d4200; }
.n.moving { opacity: .35; }
.coach { position: absolute; z-index: 26; width: 300px; padding: 14px 16px; border-radius: 12px; background: var(--surface-3); box-shadow: var(--shadow); font-size: 13px; line-height: 19px; display: none; }
.coach.on { display: block; }
.coach b { display: block; font-size: 14px; margin-bottom: 6px; }
.coach ol { margin: 0 0 10px; padding-left: 18px; color: var(--on-variant); }
.coach li { margin: 3px 0; }
.coach .row { display: flex; justify-content: flex-end; gap: 6px; }
.gtip { position: absolute; z-index: 22; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: #2b2b31; color: #fff; font-size: 12px; line-height: 16px; white-space: nowrap; display: none; }
.gtip.on { display: block; }
.gtip::before { content: ''; position: absolute; left: 30px; bottom: -4px; width: 8px; height: 8px; background: #2b2b31; transform: rotate(45deg); }
.card.tplcard { box-shadow: 0 0 0 2px var(--primary); }
[data-cardtpl="true"] .card:not(.tplcard) { opacity: .45; }
.cardnote { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--primary); }
.cardnote button { margin-left: auto; height: 28px; padding: 0 12px; border-radius: 6px; background: var(--primary); color: var(--on-primary); font-size: 12px; }
.part { position: relative; border-radius: 4px; }
.tplcard .part:hover { box-shadow: 0 0 0 1px var(--primary-line); }
.part .pbar { position: absolute; right: 2px; top: 2px; display: none; gap: 2px; background: var(--surface-3); border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.18); padding: 2px; z-index: 3; }
.tplcard .part:hover .pbar { display: flex; }
.pbar button { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; color: var(--on-variant); }
.pbar button:hover { background: var(--state-hover); color: var(--on-surface); }
.pbar .ic { font-size: 16px; }
.hidden-parts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--on-variant); }
.hidden-parts button { height: 26px; padding: 0 10px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--outline-variant); font-size: 12px; }
.card .cbtn { justify-self: start; margin-top: 6px; font-size: 13px; color: var(--primary); font-weight: 500; }
.partlist { display: grid; gap: 4px; }
.partlist div { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 8px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--outline-variant); }
.partlist div.off { color: var(--faint); box-shadow: inset 0 0 0 1px var(--outline-variant); border-style: dashed; }
.partlist div span.grow { flex: 1; }
.partlist .ib { width: 26px; height: 26px; }
.partlist .ib .ic { font-size: 16px; }
.empty-note { color: var(--faint); padding: 8px; font-size: 13px; }
.tree-row { display: flex; align-items: center; gap: 4px; height: 28px; padding-right: 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.tree-row:hover { background: var(--state-hover); }
.tree-row.on { background: var(--primary-soft); color: var(--primary); }
.tree-row .ic { font-size: 16px; color: var(--on-variant); }
.tree-row.on .ic { color: var(--primary); }
.tree-row .lock { margin-left: auto; color: var(--faint); }
.tree-row .tx { overflow: hidden; text-overflow: ellipsis; }

/* Canvas */
.canvas { position: relative; overflow: auto; background: var(--surface-1); }
.frame { margin: 24px auto 120px; background: var(--surface-0); box-shadow: var(--shadow); border-radius: 4px; transition: width var(--dur) var(--ease); position: relative; font-size: 16px; line-height: 26px; }
.frame[data-bp="desktop"] { width: min(1040px, calc(100% - 48px)); }
.frame[data-bp="tablet"] { width: 720px; }
.frame[data-bp="phone"] { width: 380px; }
.banner { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #fff4dc; color: #5d4200; font-size: 13px; }
:root[data-theme="dark"] .banner { background: #3a2e12; color: #f3d8a0; }
.banner button { margin-left: auto; height: 28px; padding: 0 12px; border-radius: 6px; background: #5d4200; color: #fff; }

.n { position: relative; }
.n.hover { box-shadow: 0 0 0 1px var(--primary-line); }
.n.sel { box-shadow: 0 0 0 2px var(--primary); z-index: 2; }
.n.typing { box-shadow: 0 0 0 1px var(--primary-soft); }
.n.tpl { opacity: .72; }
.n.tpl::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--on-surface) 3%, transparent) 10px 11px); }
.frame.tplmode .n:not(.tpl):not(.tplin) { opacity: .35; }
.frame.tplmode .n.tpl { opacity: 1; }
.n.locked { cursor: default; }
.n.dropin { box-shadow: inset 0 0 0 2px var(--primary-line); }
.txt { outline: 0; min-height: 1em; }
.txt:empty::before { content: attr(data-ph); color: var(--faint); }
.n.locked .txt { cursor: default; }

/* Insertion zones: a line with a + between blocks */
.ins { position: relative; height: 10px; margin: -5px 0; z-index: 3; }
.ins > button { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); width: 24px; height: 24px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; opacity: 0; transition: opacity 80ms, transform 80ms; }
.ins > button .ic { font-size: 18px; }
.ins::before { content: ''; position: absolute; left: 8px; right: 8px; top: 4px; height: 2px; background: var(--primary); opacity: 0; border-radius: 1px; }
.ins:hover::before, .ins.over::before, .ins.open::before { opacity: 1; }
.ins:hover > button, .ins.open > button, .ins > button:focus-visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.ins.over::before { height: 4px; top: 3px; }
.dragging .ins { height: 18px; margin: -9px 0; }
.dragging .ins::before { opacity: .25; }
.dragging .ins.over::before { opacity: 1; }
.dragging .ins > button { display: none; }

/* Block looks */
.b-section { padding-inline: 48px; }
.frame[data-bp="phone"] .b-section { padding-inline: 20px; }
.b-section[data-bg="soft"] { background: var(--surface-1); }
.b-section[data-bg="primary"] { background: var(--primary); color: var(--on-primary); }
.b-section[data-bg="primary"] .b-button > a { background: var(--on-primary); color: var(--primary); }
.b-section > .inner { max-width: 920px; margin: 0 auto; }
.b-section[data-width="narrow"] > .inner { max-width: 680px; }
.b-section[data-width="wide"] > .inner { max-width: 1120px; }
.b-area { border-radius: 6px; display: grid; gap: 12px; --g: 12px; padding: 4px 0; }
.b-area::after { content: attr(data-label); position: absolute; top: -10px; left: 8px; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 4px; background: var(--primary-soft); color: var(--primary); opacity: 0; }
.n.b-area.hover::after, .n.b-area.sel::after, .author .n.b-area::after { opacity: 1; }
.author .n.b-area { box-shadow: inset 0 0 0 2px var(--primary-line); padding: 12px; border-radius: 8px; }
.author .n.locked:not(:has(.b-area)) { opacity: .45; filter: grayscale(.4); }
.banner.as-author { background: var(--primary-soft); color: var(--on-surface); }
.banner.as-author button { background: var(--primary); color: var(--on-primary); }
.b-columns { display: grid; }
.b-column { display: grid; gap: 12px; --g: 12px; align-content: start; min-height: 40px; }
/* The + zones sit between blocks as grid rows; in the editor they would double every gap, so the gap becomes a margin. */
.frame :has(> .ins) { row-gap: 0 !important; }
.frame :has(> .ins) > .n ~ .n { margin-top: var(--g, 12px); }
.b-columns { position: relative; }
.cadd { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 14px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; opacity: 0; z-index: 5; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.b-columns.hover > .cadd, .b-columns.sel > .cadd, .cadd:focus-visible { opacity: 1; }
.cadd .ic { font-size: 18px; }
.b-heading { margin: 0; font-weight: 700; letter-spacing: -.01em; }
.b-heading[data-level="1"] { font-size: 40px; line-height: 48px; }
.b-heading[data-level="2"] { font-size: 28px; line-height: 36px; }
.b-heading[data-level="3"] { font-size: 20px; line-height: 28px; font-weight: 600; }
.frame[data-bp="phone"] .b-heading[data-level="1"] { font-size: 30px; line-height: 38px; }
.b-paragraph { margin: 0; }
.b-paragraph[data-size="lead"] { font-size: 19px; line-height: 30px; color: var(--on-variant); }
.b-list :is(ul, ol) { margin: 0; padding-left: 22px; }
.qt { margin: 0; border-left: 3px solid var(--outline-variant); padding-left: 16px; color: var(--on-variant); }
.al { display: flex; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--callout); --tone: var(--primary); }
.al .ic { color: var(--tone); margin-top: 3px; }
.al[data-status="success"] { --tone: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); }
.al[data-status="warning"] { --tone: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
.al .txt { flex: 1; }
.b-image .ph { aspect-ratio: 16/9; border-radius: 10px; background: linear-gradient(135deg, hsl(var(--h, 220) 60% 78%), hsl(calc(var(--h, 220) + 40) 60% 62%)); display: grid; place-items: center; color: rgba(255,255,255,.9); }
.b-image .ph .ic { font-size: 40px; }
.b-image[data-ratio="4/3"] .ph { aspect-ratio: 4/3; }
.b-image[data-ratio="1/1"] .ph { aspect-ratio: 1/1; }
.b-image figcaption { font-size: 14px; color: var(--on-variant); margin-top: 6px; }
.b-button > a { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 500; font-size: 15px; }
.b-button[data-look="outline"] > a { background: none; color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.b-hero { display: grid; gap: 16px; padding: 24px 0; }
.b-hero[data-align="center"] { text-align: center; justify-items: center; }
.b-hero[data-align="split"] { grid-template-columns: 1.2fr 1fr; align-items: center; }
.frame[data-bp="phone"] .b-hero[data-align="split"] { grid-template-columns: 1fr; }
.b-hero .kids { display: grid; gap: 16px; --g: 16px; }
.b-hero[data-align="center"] .kids { justify-items: center; max-width: 680px; }
.b-hero .media { display: grid; gap: 12px; align-content: center; min-height: 120px; }
.b-hero[data-align="split"] > [data-slot] { position: relative; }
.b-hero[data-align="split"] > [data-slot]::before { content: attr(data-slot); position: absolute; top: -18px; left: 0; font-size: 11px; line-height: 16px; color: var(--faint); opacity: 0; }
.b-hero.sel > [data-slot]::before, .b-hero.hover > [data-slot]::before { opacity: 1; }
.slotph { aspect-ratio: 4/3; border-radius: 16px; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--on-variant); box-shadow: inset 0 0 0 2px var(--outline-variant); background: var(--surface-1); font-size: 14px; }
.slotph:hover { box-shadow: inset 0 0 0 2px var(--primary); color: var(--primary); }
.slotph .ic { font-size: 32px; }
.sidedrop { position: fixed; width: 4px; border-radius: 2px; background: var(--primary); z-index: 60; pointer-events: none; display: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.sidedrop.on { display: block; }
.sidedrop span { position: absolute; top: 8px; left: 10px; white-space: nowrap; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 6px; background: var(--primary); color: var(--on-primary); }
.sidedrop.l span { left: auto; right: 10px; }
.banner.build { background: var(--primary-soft); color: var(--on-surface); }
.banner.build button { margin-left: 0; background: var(--primary); color: var(--on-primary); }
.banner.build button.alt { margin-left: auto; background: none; color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.mods { font: 12px/18px ui-monospace, Menlo, monospace; color: var(--on-surface); background: var(--surface-1); border-radius: 6px; padding: 6px 8px; margin-top: 4px; word-break: break-word; }
.xlist { display: grid; gap: 2px; margin: 4px 0 8px; }
.xrow { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.xrow:hover { background: var(--state-hover); }
.xrow .ic { font-size: 18px; color: var(--on-variant); }
.expose { margin-left: auto; height: 22px; padding: 0 6px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; gap: 3px; color: var(--faint); box-shadow: inset 0 0 0 1px var(--outline-variant); }
.expose[aria-pressed="true"] { color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.expose .ic { font-size: 14px; }
.newblock { margin: 4px 8px 8px; width: calc(100% - 16px); }
.b-features { display: grid; }
.b-features .f { display: grid; gap: 6px; align-content: start; position: relative; }
.b-features .fic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }

    <li><b>Библиотека слева</b>: недавние, избранное и разделы — Текст, Медиа, Структура, Маркетинг и другие. Поиск ищет во всех разделах. «+» в тексте сразу открывает раздел «Текст».</li>

    <li><b>Как в Markdown</b>: в начале абзаца «- » — список, «1. » — нумерованный, «# », «## », «### » — заголовки, «> » — цитата. Пустой пункт + Enter — выход из списка.</li>
    <li><b>Колонки</b>: тяните блок к левому или правому краю другого — встанут рядом. Или меню блока → «Разделить на колонки».</li>
    <li><b>Сетка по экранам</b> — модификаторы SIMAI Framework. Вкладка <b>HTML</b> у блока показывает, какие классы получатся.</li>
    <li><b>Свой блок</b>: «Создать свой блок» в библиотеке или «Сделать блок из этого…» в меню. Блок сайта закрыт: автор меняет текст и то, что открыл дизайнер.</li>
  </ul>
  <div class="grp" style="margin-left:0">Попробуйте</div>
  <ul class="help">
    <li>Справа, когда ничего не выбрано: «Посмотреть глазами автора» — так страницу видит человек без прав на макет.</li>
    <li>Шапка и подвал бледнее — это <b>шаблон</b>. Выберите шапку → «Изменить шаблон».</li>
    <li>Выберите «Список карточек» → вкладка <b>Данные</b>: смените источник, посмотрите «Пусто» и «Ошибка».</li>
    <li>Переключите <b>телефон</b> вверху и задайте колонкам 1 — на компьютере останется 2. Во вкладке <b>HTML</b> появится <code>grid-col-1 md:grid-col-2</code> (планшет наследует компьютер).</li>
    <li>Первый экран: картинка справа — обычный блок, её можно заменить или удалить.</li>
    <li>Выберите первый экран → меню → «Сделать блок из этого…», отметьте «Фон» для автора и сохраните.</li>
    <li>Тема сайта задаётся в настройках сайта. Справа «Показать с компактной темой» — значения по умолчанию меняются у всех секций сразу, кроме заданных в самом блоке.</li>
  </ul></div>`;
}

/* ---------- Bottom path ---------- */
function renderPath() {
  const p = S.sel ? pathTo(S.sel).filter(x => x.type !== 'layout.page') : [];
  $('#path').innerHTML = `<button data-go="">Страница</button>${p.map(x => `<span class="ic">chevron_right</span><button data-go="${x.id}">${esc(T[x.type].name)}</button>`).join('')}<span class="tip">${S.typing ? 'Печатаете · Esc — выбрать блок · Alt+Shift+↑↓ — переставить' : S.sel ? 'Enter — внутрь · Esc — выше · ⌫ — удалить' : 'Щёлкните блок или текст'}</span>`;
}
$('#path').addEventListener('click', ev => { const g = ev.target.closest('[data-go]'); if (g) choose(g.dataset.go || null, { scroll: true }); });

/* ---------- HTML out: what a site prints, editor marks removed ---------- */
const VOID = new Set(['input', 'img', 'br', 'hr']);
function outHtml(n) {
  const d = document.createElement('div'); d.innerHTML = draw(n);
  d.querySelectorAll('.ins, .bound, .pbar, .cardnote, .hidden-parts, .slotph').forEach(x => x.remove());
  d.querySelectorAll('*').forEach(x => {
    ['contenteditable', 'spellcheck', 'data-ph', 'data-key', 'data-id', 'data-cardtpl', 'data-label', 'data-slot', 'draggable', 'onclick', 'style', 'disabled', 'title', 'tabindex'].forEach(a => x.removeAttribute(a));
    x.classList.remove('n', 'sel', 'hover', 'locked', 'tpl', 'tplin', 'txt', 'typing', 'moving', 'part', 'tplcard');
    if (!x.classList.length) x.removeAttribute('class');
  });
  // the editor wraps a text block in a frame; the site prints the text element alone
  d.querySelectorAll('div').forEach(x => { const c = x.firstElementChild; if (x.children.length === 1 && c.className && c.className === x.className) x.replaceWith(c); });
  return pretty(d, 0);
}
function pretty(p, lv) {
  let s = '';
  const pad = '  '.repeat(lv);
  for (const c of p.childNodes) {
    if (c.nodeType === 3) { const t = c.textContent.trim(); if (t) s += pad + t + '\n'; continue; }
    if (c.nodeType !== 1) continue;
    const tag = c.tagName.toLowerCase(), at = [...c.attributes].map(a => ` ${a.name}="${a.value}"`).join('');
    if (VOID.has(tag)) s += `${pad}<${tag}${at}>\n`;
    else if (!c.children.length) s += `${pad}<${tag}${at}>${c.textContent.trim()}</${tag}>\n`;
    else s += `${pad}<${tag}${at}>\n${pretty(c, lv + 1)}${pad}</${tag}>\n`;
  }
  return s;
}

/* ---------- Document out: only what differs ---------- */
function serialize(n) {
  if (n.block) { // a site block: its type and what differs from it on this page
    const ct = T[n.block].custom, o = { id: n.id, type: n.block, version: 1 }, props = {}, text = {};
    for (const e of ct.exposed) { const x = atPath(n, e.path), t0 = atPath(ct.tree, e.path); if (x && JSON.stringify(x.props[e.key]) !== JSON.stringify(t0?.props?.[e.key])) props[(e.path || 'root') + ':' + e.key] = x.props[e.key]; }
    walk(n, x => { if (x === n) return; const ps = ipath(x.id, n.id), t0 = atPath(ct.tree, ps); if (x.data?.text !== undefined && x.data.text !== t0?.data?.text) text[ps] = x.data.text; });
    if (Object.keys(props).length) o.props = props;
    if (Object.keys(text).length) o.data = { text };
    return o;
  }
  const o = { id: n.id, type: n.type };
  if (n.variant) o.variant = n.variant;
  if (Object.keys(n.props).length) o.props = n.props;
  if (n.bp && Object.values(n.bp).some(x => Object.keys(x).length)) o.responsive = n.bp;
  if (Object.keys(n.data || {}).length) o.data = n.data;
  if (n.bindings?.length) o.bindings = n.bindings.map(b => ({ owner: b.owner, ref: b.ref, target: b.target, ...(b.query ? { query: b.query } : {}), ...(b.map ? { map: b.map } : {}) }));
  if (n.template) o.extensions = { template: 'site-default' };
  if (n.children) o.slots = { default: n.children.map(serialize) };
  return o;
}
$('#help').onclick = () => {
  $('#mbox').innerHTML = `<header><span class="ic">help</span>Как здесь работать<span class="grow"></span><button class="ib" data-close><span class="ic">close</span></button></header><div style="overflow:auto">${helpHtml()}</div><footer><button class="btn pri" data-close>Понятно</button></footer>`;
  $('#modal').classList.add('on');
};
right.addEventListener('input', ev => { const k = ev.target.dataset.meta; if (k && k !== 'tpl') { S.meta[k] = ev.target.value; S.meta.status = 'draft'; } });
right.addEventListener('change', ev => { if (ev.target.dataset.meta === 'tpl') commit(() => { S.meta.tpl = ev.target.value; S.meta.status = 'draft'; }, ev.target.value === 'none' ? 'Шапка и подвал на этой странице скрыты; шаблон сайта не изменился' : 'Шаблон сайта снова на странице'); });
right.addEventListener('click', ev => {
  if (ev.target.closest('#siteSettings')) { toast('Откроются настройки сайта в Larena или Bitrix: тема меняется там, для всех страниц'); return; }
  if (ev.target.closest('#asCompact')) { S.theme = S.theme === 'compact' ? 'normal' : 'compact'; render(); toast(S.theme === 'compact' ? 'Так страница выглядит, если в настройках сайта выбрать компактную тему: у секций отступ M, в списках по 4' : 'Снова обычная тема'); return; }
  if (ev.target.closest('#asAuthor')) { setRole('author'); canvas.scrollTop = 0; return; }
  if (ev.target.id === 'publish') { S.meta.status = 'live'; renderRight(); toast('Опубликовано. Предыдущая версия сохранена в истории'); }
  if (ev.target.id === 'versions') toast('История версий: в прототипе не показана. В Bitrix-редакторе их хранится 50, каждую можно вернуть');
});
$('#coachOk').onclick = () => { $('#coach').classList.remove('on'); remember('coach'); };
$('#coachMore').onclick = () => { $('#coach').classList.remove('on'); remember('coach'); $('#help').click(); };
$('#json').onclick = () => {
  $('#mbox').innerHTML = `<header><span class="ic">data_object</span>Документ страницы<span class="grow"></span><button class="ib" data-close><span class="ic">close</span></button></header><pre>${esc(JSON.stringify({ schema: 'simai.composition.document', version: 1, profile: 'ui-layout', root: serialize(S.doc) }, null, 2))}</pre><footer><span class="hint" style="margin-right:auto">Один документ: макет, текст, параметры и связи с данными. Markdown и HTML — преобразования из него.</span><button class="btn" data-close>Закрыть</button></footer>`;
  $('#modal').classList.add('on');
};

/* ---------- Top bar ---------- */
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#bp').addEventListener('click', ev => { const b = ev.target.closest('[data-bp]'); if (!b) return; S.bp = b.dataset.bp; $$('#bp button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
// The role is not a switch in the editor: the site's access rights decide it. The prototype only lets the owner look.
function setRole(r) {
  S.role = r; S.tplEdit = false; S.typing = null; S.sel = null; S.lib.sub = null;
  render();
}
$('#dark').onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; };

let tt = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

render();
if (!seen('coach')) { const c = $('#coach'); c.style.left = '24px'; c.style.top = '24px'; c.classList.add('on'); }
</script>
