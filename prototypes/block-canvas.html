<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Холст блоков: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>
/* Prototype for approval (2026-10-31): how a block is hovered, selected, moved
   and added, and how the side panels resize and close. It tests behaviour; the
   port goes to sf-editor-overlay and sf-resizer. Sizes follow the
   Framework's ladder (24/32/40/48) and colours its role names. */
:root {
  color-scheme: light;
  --surface-0: #fbf8ff; --surface-1: #f5f2fa; --surface-3: #ffffff;
  --on-surface: #1b1b21; --on-variant: #5d5d68; --outline-variant: #e0dee8;
  --primary: #2156c1; --on-primary: #ffffff; --primary-soft: rgba(33,86,193,.12);
  --state-hover: rgba(27,27,33,.05); --state-press: rgba(27,27,33,.1);
  --error: #ba1a1a;
  --canvas: #f0eef5;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.1);
  --ease: cubic-bezier(.2,0,0,1);
  --dur: 180ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121318; --surface-1: #1a1b21; --surface-3: #2a2a31;
  --on-surface: #e3e1e9; --on-variant: #a6a5b0; --outline-variant: #34343c;
  --primary: #b3c5ff; --on-primary: #002b75; --primary-soft: rgba(179,197,255,.16);
  --state-hover: rgba(227,225,233,.06); --state-press: rgba(227,225,233,.12);
  --error: #ffb4ab;
  --canvas: #0d0e12;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--surface-0); color: var(--on-surface);
  font: 14px/20px Inter, -apple-system, system-ui, sans-serif;
  display: grid; grid-template-rows: 48px 1fr; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.ic { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; font-weight: 400; font-variation-settings: 'opsz' 20; user-select: none; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* A quiet icon button, 32px: size 1/2 of the ladder. */
.ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--on-variant); position: relative; flex: none; }
.ib:hover { background: var(--state-hover); color: var(--on-surface); }
.ib:active { background: var(--state-press); }
.ib[disabled] { opacity: .32; pointer-events: none; }
.ib[aria-pressed="true"] { color: var(--primary); }
.ib.danger:hover { color: var(--error); }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 30; white-space: nowrap; pointer-events: none;
  background: var(--on-surface); color: var(--surface-0); font-size: 12px; line-height: 16px; padding: 4px 8px; border-radius: 6px;
  opacity: 0; transition: opacity 100ms; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transition-delay: 500ms; }
[data-tip-side="end"]::after { top: 50%; left: calc(100% + 8px); transform: translateY(-50%); }
[data-tip-side="start"]::after { top: 100%; left: auto; right: 0; transform: none; margin-top: 6px; }

/* The top bar */
.bar { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--outline-variant); min-width: 0; }
.bar .doc { display: flex; align-items: baseline; gap: 8px; margin-inline: 8px; min-width: 0; white-space: nowrap; }
.bar .doc b { font-weight: 500; }
.bar .doc span { color: var(--on-variant); font-size: 12px; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; height: 32px; padding: 2px; border-radius: 8px; background: var(--state-hover); }
.seg button { padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; color: var(--on-variant); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--on-surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg .ic { font-size: 18px; }
.tag { font-size: 12px; color: var(--on-variant); margin-inline: 8px 4px; white-space: nowrap; }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 500; display: flex; align-items: center; gap: 6px; margin-left: 4px; }
.btn .ic { font-size: 18px; }

/* The three columns. Each panel's inside keeps its width, so closing one slides it away without rewrapping its text. */
.work { display: grid; grid-template-columns: var(--left, 264px) minmax(0, 1fr) var(--right, 300px); grid-template-rows: minmax(0, 1fr); min-height: 0; transition: grid-template-columns var(--dur) var(--ease); }
.work.resizing { transition: none; user-select: none; cursor: col-resize; }
.panel { overflow: hidden; position: relative; background: var(--surface-0); min-width: 0; }
.panel > .in { height: 100%; overflow-y: auto; }
.panel.l > .in { width: var(--left-open, 264px); }
.panel.r > .in { width: var(--right-open, 300px); float: right; }
.split { position: relative; width: 0; z-index: 8; }
.split i { position: absolute; top: 0; bottom: 0; left: -5px; width: 9px; cursor: col-resize; display: block; }
.split i::before { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--outline-variant); transition: background 100ms; }
.split i:hover::before, .split i:focus-visible::before, .resizing .split i.on::before { left: 3px; width: 3px; background: var(--primary); transition-delay: 120ms; }
.split i:focus-visible { outline: 0; }
.split[hidden] { display: none; }
.mid { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.mid > .split-l { position: absolute; left: 0; top: 0; bottom: 0; }
.mid > .split-r { position: absolute; right: 0; top: 0; bottom: 0; }

/* Left panel */
.head { position: sticky; top: 0; background: var(--surface-0); padding: 8px; z-index: 1; }
.head .seg { display: flex; }
.head .seg button { flex: 1; justify-content: center; }
.rows { list-style: none; margin: 0; padding: 0 8px 16px; }
.row { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border-radius: 8px; text-align: left; color: var(--on-surface); }
.row .ic { color: var(--on-variant); font-size: 18px; }
.row:hover { background: var(--state-hover); }
.row[aria-current="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
.row[aria-current="true"] .ic { color: var(--primary); }
.row span.t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .pin { font-size: 14px; opacity: .6; }
.rows h3 { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--on-variant); margin: 12px 8px 4px; }

/* Right panel */
.insp { padding: 12px 16px 24px; display: grid; gap: 12px; }
.insp h2 { font-size: 15px; line-height: 20px; font-weight: 600; margin: 0 0 4px; }
.insp label { display: grid; gap: 4px; font-size: 12px; line-height: 16px; color: var(--on-variant); }
.insp input, .insp textarea {
  font: 14px/20px Inter, -apple-system, system-ui, sans-serif; color: var(--on-surface); background: var(--surface-0);
  border: 1px solid var(--outline-variant); border-radius: 8px; padding: 5px 10px; width: 100%; resize: vertical; min-height: 32px;
}
.insp input:focus, .insp textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.insp p { margin: 0; color: var(--on-variant); font-size: 13px; }
.insp kbd { font: 12px/16px Inter, sans-serif; background: var(--state-hover); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; color: var(--on-variant); align-items: baseline; }

/* The canvas. The overlay sits inside the scrolled content, so frames and
   toolbars travel with the letter on scroll: no script, nothing to lag. */
.scroll { overflow: auto; background: var(--canvas); padding: 24px 16px 96px; position: relative; min-width: 0; min-height: 0; }
.stage { position: relative; margin-inline: auto; width: var(--paper, 600px); transition: width var(--dur) var(--ease); }
.stage iframe { display: block; width: 100%; border: 0; background: #fff; border-radius: 4px; box-shadow: var(--shadow); }
.over { position: absolute; inset: 0; pointer-events: none; }
.frame { position: absolute; left: 0; right: 0; pointer-events: none; }
.frame.hover { box-shadow: inset 0 0 0 1px var(--primary); opacity: .5; }
.frame.sel { box-shadow: inset 0 0 0 2px #2156c1; }
.go .frame.sel { transition: top var(--dur) var(--ease), height var(--dur) var(--ease); }
.go .rail { transition: top var(--dur) var(--ease), height var(--dur) var(--ease); }

/* The action toolbar: icons only, in a rail that holds it beside the block. */
.rail { position: absolute; left: calc(100% + 12px); width: 40px; pointer-events: none; }
.tools { position: sticky; top: 12px; pointer-events: auto; display: flex; flex-direction: column; gap: 0; padding: 4px; width: 40px; background: var(--surface-3); border-radius: 12px; box-shadow: var(--shadow); }
.tools hr { border: 0; height: 1px; width: 20px; background: var(--outline-variant); margin: 4px auto; }
.tools .grip { cursor: grab; }
.tools .grip:active { cursor: grabbing; }
.top .rail { left: 0; width: auto; right: 0; display: flex; justify-content: flex-end; padding-right: 8px; }
.top .tools { flex-direction: row; width: auto; top: 8px; right: 8px; align-self: flex-start; }
.top .tools hr { width: 1px; height: 20px; margin: auto 4px; }

/* Where a block can be added: one thin line and one button, only under the pointer. */
.gap { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity 80ms; }
.gap.on { opacity: 1; }
.gap::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: #2156c1; }
.gap button { position: absolute; left: 50%; top: -12px; margin-left: -12px; width: 24px; height: 24px; border-radius: 50%; background: #2156c1; color: #fff; display: none; place-items: center; pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.gap.on button { display: grid; }
.gap button .ic { font-size: 16px; }
.gap button:hover { transform: scale(1.12); }
.gap.drop button { display: none; }

/* Quick insert */
.pop { position: absolute; z-index: 20; width: 264px; background: var(--surface-3); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; pointer-events: auto; }
.pop[hidden] { display: none; }
.pop input { width: 100%; height: 32px; border: 0; background: var(--state-hover); border-radius: 8px; padding: 0 10px; font: inherit; color: inherit; margin-bottom: 4px; }
.pop input:focus { outline: 0; }
.pop .row.active { background: var(--state-hover); }
.pop .none { padding: 8px; color: var(--on-variant); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); background: var(--on-surface); color: var(--surface-0); border-radius: 10px; padding: 8px 8px 8px 14px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity var(--dur), transform var(--dur) var(--ease); z-index: 40; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: inherit; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(127,127,127,.25); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="toggle-left" aria-pressed="true" aria-controls="left" data-tip="Панель блоков  ⌘\" data-tip-side="end" aria-label="Панель блоков"><span class="ic">left_panel_close</span></button>
  <div class="doc"><b>Новое письмо</b><span id="saved">Сохранено</span></div>
  <button class="ib" id="undo" aria-label="Отменить" data-tip="Отменить  ⌘Z" disabled><span class="ic">undo</span></button>
  <button class="ib" id="redo" aria-label="Повторить" data-tip="Повторить  ⇧⌘Z" disabled><span class="ic">redo</span></button>
  <div class="grow"></div>
  <div class="seg" role="group" aria-label="Ширина письма" id="widths">
    <button data-w="600" aria-pressed="true"><span class="ic">desktop_windows</span>600</button>
    <button data-w="375" aria-pressed="false"><span class="ic">smartphone</span>375</button>
    <button data-w="320" aria-pressed="false"><span class="ic">phone_iphone</span>320</button>
  </div>
  <div class="grow"></div>
  <span class="tag">Прототип: действия</span>
  <div class="seg" role="group" aria-label="Где панель действий" id="place">
    <button data-p="side" aria-pressed="false">Сбоку</button>
    <button data-p="top" aria-pressed="true">Сверху</button>
  </div>
  <button class="ib" id="theme" aria-label="Тема" data-tip="Светлая или тёмная" data-tip-side="start"><span class="ic">dark_mode</span></button>
  <button class="btn"><span class="ic">download</span>Экспорт</button>
  <button class="ib" id="toggle-right" aria-pressed="true" aria-controls="right" data-tip="Панель свойств  ⌥⌘\" data-tip-side="start" aria-label="Панель свойств"><span class="ic">right_panel_close</span></button>
</header>

<div class="work" id="work">
  <aside class="panel l" id="left" aria-label="Блоки"><div class="in">
    <div class="head"><div class="seg" role="group" id="tabs">
      <button data-tab="tree" aria-pressed="true">Структура</button>
      <button data-tab="lib" aria-pressed="false">Библиотека</button>
    </div></div>
    <ul class="rows" id="rows"></ul>
  </div></aside>

  <main class="mid">
    <div class="split split-l"><i id="split-l" role="separator" aria-orientation="vertical" aria-label="Ширина панели блоков" tabindex="0"></i></div>
    <div class="scroll" id="scroll">
      <div class="stage" id="stage">
        <iframe id="letter" title="Письмо" scrolling="no" tabindex="-1" sandbox="allow-same-origin"></iframe>
        <div class="over" id="over">
          <div class="frame hover" id="f-hover" hidden></div>
          <div class="frame sel" id="f-sel" hidden></div>
          <div class="rail" id="rail" hidden>
            <div class="tools" id="tools" role="toolbar" aria-label="Действия с блоком" aria-orientation="vertical"></div>
          </div>
          <div class="gap" id="gap"><button id="gap-add" aria-label="Добавить блок здесь"><span class="ic">add</span></button></div>
          <div class="pop" id="pop" hidden role="dialog" aria-label="Добавить блок">
            <input id="pop-q" placeholder="Найти блок" aria-label="Найти блок">
            <div id="pop-list" role="listbox"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="split split-r"><i id="split-r" role="separator" aria-orientation="vertical" aria-label="Ширина панели свойств" tabindex="0"></i></div>
  </main>

  <aside class="panel r" id="right" aria-label="Свойства"><div class="in"><div class="insp" id="insp"></div></div></aside>
</div>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-u">Отменить</button></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {get(k) { try { return localStorage.getItem('block-canvas.' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('block-canvas.' + k, v); } catch {} }};

/* The block kinds. The letter's own look is a stand-in for the real renderer. */
const KINDS = {
  header: {label: 'Шапка', icon: 'web_asset', pinned: true, fields: [['name', 'Название']], html: (d) => `<div class="pad head"><span class="logo">▣</span> <b data-edit="name">${esc(d.name)}</b></div>`},
  hero: {label: 'Главное сообщение', icon: 'campaign', fields: [['title', 'Заголовок'], ['text', 'Текст', 1]], html: (d) => `<div class="pad"><h1 data-edit="title">${esc(d.title)}</h1><p data-edit="text">${esc(d.text)}</p></div>`},
  text: {label: 'Текст', icon: 'notes', fields: [['text', 'Текст', 1]], html: (d) => `<div class="pad"><p data-edit="text">${esc(d.text)}</p></div>`},
  button: {label: 'Кнопка', icon: 'smart_button', fields: [['label', 'Надпись']], html: (d) => `<div class="pad"><a class="cta" href="#" data-edit="label">${esc(d.label)}</a></div>`},
  image: {label: 'Картинка', icon: 'image', fields: [['caption', 'Подпись']], html: (d) => `<div class="pad"><div class="img"></div><p class="cap" data-edit="caption">${esc(d.caption)}</p></div>`},
  schedule: {label: 'Программа', icon: 'event_note', fields: [['title', 'Заголовок'], ['t1', 'Время 1'], ['h1', 'Пункт 1'], ['t2', 'Время 2'], ['h2', 'Пункт 2']], html: (d) => `<div class="pad tint"><h2 data-edit="title">${esc(d.title)}</h2><table><tr><td class="time" data-edit="t1">${esc(d.t1)}</td><td><b data-edit="h1">${esc(d.h1)}</b></td></tr><tr><td class="time" data-edit="t2">${esc(d.t2)}</td><td><b data-edit="h2">${esc(d.h2)}</b></td></tr></table></div>`},
  footer: {label: 'Подвал', icon: 'call_to_action', pinned: true, fields: [['reason', 'Почему пришло письмо', 1]], html: (d) => `<div class="pad foot"><p data-edit="reason">${esc(d.reason)}</p><a href="#">Отписаться от рассылки</a></div>`},
};
const NEW = {
  hero: {title: 'Главное сообщение', text: 'Одна мысль, ради которой написано письмо.'},
  text: {text: 'Короткий абзац: что важно знать читателю.'},
  button: {label: 'Подробнее'},
  image: {caption: 'Подпись к картинке'},
  schedule: {title: 'Программа', t1: '10:00–11:00', h1: 'Первый пункт', t2: '11:00–12:00', h2: 'Второй пункт'},
};
let uid = 10;
let blocks = [
  {id: 'b1', kind: 'header', d: {name: 'Example Studio'}},
  {id: 'b2', kind: 'hero', d: {title: 'Открытая встреча 14 ноября', text: 'Расскажем, что нового в продукте, и ответим на вопросы. Участие бесплатное, нужна регистрация.'}},
  {id: 'b3', kind: 'image', d: {caption: 'Прошлая встреча, весна'}},
  {id: 'b4', kind: 'schedule', d: {title: 'Программа', t1: '10:00–11:00 по Москве', h1: 'Что нового в продукте', t2: '11:00–12:00 по Москве', h2: 'Ответы на вопросы'}},
  {id: 'b5', kind: 'button', d: {label: 'Зарегистрироваться'}},
  {id: 'b6', kind: 'text', d: {text: 'Запись пришлём всем, кто зарегистрировался. Если вопрос срочный, просто ответьте на это письмо.'}},
  {id: 'b7', kind: 'footer', d: {reason: 'Вы получили это письмо, потому что подписались на новости Example Studio.'}},
];
let selected = null, hovered = null, editing = null, placement = 'top', tab = 'tree';
const undoStack = [], redoStack = [];

const LETTER_CSS = `
  html,body{margin:0;background:#fff;color:#1f1f1f;font:16px/24px Arial,Helvetica,sans-serif;overflow:hidden}
  [data-b]{position:relative;cursor:default;background:#fff}
  .pad{padding:20px 40px}
  .head{border-bottom:1px solid #e3e5e7;font-size:17px}.logo{font-size:22px}
  h1{font-size:30px;line-height:36px;margin:8px 0 12px}h2{font-size:22px;line-height:28px;margin:0 0 12px}p{margin:0}
  .cta{display:inline-block;background:#2156c1;color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:6px}
  .img{height:200px;border-radius:6px;background:linear-gradient(135deg,#c9d6f5,#e8d9f1 60%,#f7e3d0)}.cap{font-size:13px;color:#696969;margin-top:8px}
  .tint{background:#eef2fc}table{border-collapse:collapse;width:100%}td{padding:12px 0;border-top:1px solid #d9dee8;vertical-align:top}.time{width:34%;color:#696969;padding-right:16px;font-size:14px}
  .foot{border-top:1px solid #e3e5e7;font-size:13px;line-height:20px;color:#696969}.foot a{color:#2156c1;display:inline-block;margin-top:8px}
  [contenteditable]{outline:2px solid #2156c1;outline-offset:2px;border-radius:2px;cursor:text}
  @media (max-width:620px){.pad{padding:16px 20px}h1{font-size:25px;line-height:30px}.time{width:40%}}`;

const frame = $('letter');
let doc;
function boot() {
  frame.srcdoc = `<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>${LETTER_CSS}</style></head><body></body></html>`;
  frame.addEventListener('load', () => {
    doc = frame.contentDocument;
    wireLetter();
    patch();
    new ResizeObserver(fit).observe(doc.body);
    fit();
    renderRows();
    renderInsp();
  }, {once: true});
}

/* The letter is patched block by block and never reloaded: this is what stops the flicker. */
function patch() {
  const seen = new Set();
  let cursor = doc.body.firstElementChild;
  for (const b of blocks) {
    seen.add(b.id);
    let el = doc.querySelector(`[data-b="${b.id}"]`);

$('place').addEventListener('click', (e) => {

});
const setTheme = (t) => { document.documentElement.dataset.theme = t; $('theme').firstElementChild.textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; store.set('theme', t); };
setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
new ResizeObserver(() => { if (doc) { renderTools(); place(); } }).observe($('scroll'));

boot();
</script>
